# الاختبارات بتشتغل لوحدها على GitHub مع كل رفع وكل Pull Request.
# لو فيه اختبار فشل، صاحب المستودع بيوصله إيميل، والتقرير بيتحفظ في صفحة الـ Action.
name: الاختبارات

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: اختبارات السيرفر
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    name: اختبارات المتصفح
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
