<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسوخ | أكاديمية العلم الشرعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F0E2;
    --bg-raised:#FBF8EE;
    --ink:#1B2C28;
    --ink-soft:#4A5C56;
    --teal-900:#0E332F;
    --teal-700:#1F5951;
    --teal-600:#2C6E64;
    --gold:#B9924F;
    --gold-light:#E4C77E;
    --sage:#7C9683;
    --terracotta:#A8503A;
    --line:#DCD3B8;
    --line-soft:#E9E2CB;
    --shadow: 0 8px 24px rgba(14,51,47,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(185,146,79,.10), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(31,89,81,.10), transparent 40%),
      var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 18px 60px;
  }
  h1,h2,.brand,.display{font-family:'Amiri', serif;}
  button{font-family:inherit; cursor:pointer;}
  :focus-visible{outline:2px solid var(--teal-700); outline-offset:2px;}

  /* ===== Hero ===== */
  .hero{
    text-align:center;
    margin:20px 0 40px;
    max-width:560px;
  }
  .seal-mark{
    width:74px; height:74px; border-radius:50%;
    border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 18px;
    font-family:'Amiri', serif; font-weight:700; font-size:1.3rem; color:var(--gold);
    background:var(--bg-raised);
  }
  .hero h1{
    font-size:2.4rem;
    color:var(--teal-900);
    margin:0 0 8px;
  }
  .hero p{
    color:var(--ink-soft);
    font-size:.98rem;
    line-height:1.9;
    margin:0;
  }

  /* ===== Auth cards ===== */
  .cards-wrap{
    display:flex;
    gap:24px;
    max-width:900px;
    width:100%;
    align-items:flex-start;
    flex-wrap:wrap;
    justify-content:center;
  }
  .card{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:28px 26px;
    flex:1;
    min-width:300px;
    max-width:420px;
  }
  .card h2{
    font-size:1.3rem;
    color:var(--teal-900);
    margin:0 0 4px;
    display:flex; align-items:center; gap:8px;
  }
  .card h2::before{content:"◆"; color:var(--gold); font-size:.7rem;}
  .card .subtitle{
    font-size:.78rem;
    color:var(--ink-soft);
    margin:0 0 20px;
  }
  label{
    display:block;
    font-size:.78rem;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  input{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:inherit;
    font-size:.9rem;
    margin-bottom:14px;
    background:#fff;
    color:var(--ink);
  }
  input:focus{border-color:var(--teal-700);}
  .row-2{display:flex; gap:12px;}
  .row-2 > div{flex:1;}

  .submit-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:var(--teal-700);
    color:#fff;
    font-weight:600;
    font-size:.92rem;
    transition:background .18s ease;
  }
  .submit-btn:hover{background:var(--teal-900);}
  .submit-btn:disabled{opacity:.6; cursor:not-allowed;}

  /* ===== التبديل بين الدخول وإنشاء حساب ===== */
  .card[hidden]{display:none;}
  .switch-divider{
    display:flex; align-items:center; gap:10px;
    margin:22px 0 14px;
    font-size:.78rem; color:var(--ink-soft);
  }
  .switch-divider::before, .switch-divider::after{content:""; flex:1; height:1px; background:var(--line);}
  .secondary-btn{
    display:block;
    width:100%;
    padding:12px;
    border:1px solid var(--teal-700);
    border-radius:8px;
    background:transparent;
    color:var(--teal-700);
    font-weight:600;
    font-size:.92rem;
    text-align:center;
    text-decoration:none;
    transition:background .18s ease, color .18s ease;
  }
  .secondary-btn:hover{background:var(--teal-700); color:#fff;}
  .switch-back{
    text-align:center;
    font-size:.82rem;
    color:var(--ink-soft);
    margin:16px 0 0;
  }
  .switch-back a{color:var(--teal-700); font-weight:600;}

  .error-box{
    background:rgba(168,80,58,.1);
    color:var(--terracotta);
    border:1px solid rgba(168,80,58,.3);
    padding:10px 12px;
    border-radius:8px;
    font-size:.82rem;
    margin-bottom:14px;
    display:none;
  }
  .success-box{
    background:rgba(124,150,131,.15);
    color:var(--teal-900);
    border:1px solid rgba(124,150,131,.4);
    padding:10px 12px;
    border-radius:8px;
    font-size:.82rem;
    margin-bottom:14px;
    display:none;
  }

  .demo-hint{
    font-size:.7rem;
    color:var(--ink-soft);
    margin-top:14px;
    line-height:1.8;
    text-align:center;
  }
  .demo-hint code{
    background:var(--line-soft);
    padding:1px 6px;
    border-radius:4px;
  }

  @media (max-width:640px){
    .hero h1{font-size:1.9rem;}
    .card{padding:22px 18px;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="seal-mark">رسوخ</div>
  <h1>رسوخ</h1>
  <p>أكاديمية علمية للعلم الشرعي — مراحل مُرتّبة، وسندٌ علمي واضح من التمهيدية حتى الثالثة، في الفقه والتفسير والحديث ومصطلحه.</p>
</div>

<div class="cards-wrap">
  <!-- بطاقة تسجيل الدخول (أول حاجة بتظهر) -->
  <div class="card" id="loginCard">
    <h2>تسجيل الدخول</h2>
    <p class="subtitle">ادخل ببريدك الإلكتروني وكلمة المرور</p>
    <div class="error-box" id="loginError"></div>
    <form id="loginForm">
      <label for="loginEmail">البريد الإلكتروني</label>
      <input type="email" id="loginEmail" required autocomplete="email">
      <label for="loginPassword">كلمة المرور</label>
      <input type="password" id="loginPassword" required autocomplete="current-password">
      <button type="submit" class="submit-btn" id="loginBtn">دخول</button>
    </form>
    <div class="switch-divider">ليس لديك حساب؟</div>
    <a class="secondary-btn" href="#register">إنشاء حساب جديد</a>
  </div>

  <!-- بطاقة تسجيل طالب جديد (بتظهر بزرار "إنشاء حساب جديد") -->
  <div class="card" id="registerCard" hidden>
    <h2>طالب جديد</h2>
    <p class="subtitle">أنشئ حسابك وابدأ رحلتك العلمية</p>
    <div class="error-box" id="registerError"></div>
    <div class="success-box" id="registerSuccess"></div>
    <form id="registerForm">
      <label for="regName">الاسم الكامل</label>
      <input type="text" id="regName" required>
      <label for="regEmail">البريد الإلكتروني</label>
      <input type="email" id="regEmail" required>
      <div class="row-2">
        <div>
          <label for="regPhone">رقم الهاتف</label>
          <input type="tel" id="regPhone">
        </div>
        <div>
          <label for="regAge">العمر</label>
          <input type="number" id="regAge" min="5" max="100">
        </div>
      </div>
      <label for="regAddress">العنوان</label>
      <input type="text" id="regAddress">
      <label for="regPassword">كلمة المرور (8 أحرف على الأقل)</label>
      <input type="password" id="regPassword" required minlength="8" autocomplete="new-password">
      <button type="submit" class="submit-btn" id="registerBtn">تسجيل</button>
    </form>
    <p class="switch-back">لديك حساب بالفعل؟ <a href="#login">تسجيل الدخول</a></p>
  </div>
</div>

<script src="password-eye.js"></script>
<script>
const API_BASE = "/api"; // نسبي: يعمل محليًا وبعد النشر بدون تعديل

async function apiFetch(path, options = {}) {
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: { "Content-Type": "application/json", ...(options.headers || {}) },
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    throw new Error(data.error || "تعذّر الاتصال بالخادم، تأكد أن الباك إند يعمل على http://localhost:4000");
  }
  return data;
}

function setLoading(btn, loadingText, normalText) {
  btn.disabled = true;
  btn.textContent = loadingText;
  return () => { btn.disabled = false; btn.textContent = normalText; };
}

/* ======================= الدخول أولاً، وزرار لإنشاء حساب ======================= */
// #register بيعرض إنشاء الحساب، وأي حاجة تانية بتعرض الدخول (وزرار الرجوع في المتصفح بيشتغل)
function showView() {
  const register = location.hash === "#register";
  document.getElementById("loginCard").hidden = register;
  document.getElementById("registerCard").hidden = !register;
}
window.addEventListener("hashchange", () => {
  showView();
  document.getElementById(location.hash === "#register" ? "regName" : "loginEmail").focus();
});
showView();

/* ======================= تسجيل الدخول (طالب أو مشرف) ======================= */
// السيرفر بيحدد نوع الحساب، والصفحة بتوجّه كل واحد لصفحته
function goHome(role) {
  window.location.href = role === "admin" ? "admin.html" : "student.html";
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errorBox = document.getElementById("loginError");
  errorBox.style.display = "none";
  const reset = setLoading(document.getElementById("loginBtn"), "جارٍ الدخول...", "دخول");

  try {
    const data = await apiFetch("/auth/login", {
      method: "POST",
      body: JSON.stringify({ email, password }),
    });
    const role = data.role === "admin" ? "admin" : "student";
    localStorage.setItem("rasokh_token", data.token);
    localStorage.setItem("rasokh_role", role);
    goHome(role);
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = "block";
    reset();
  }
});

/* ======================= تسجيل طالب جديد ======================= */
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById("registerError");
  const successBox = document.getElementById("registerSuccess");
  errorBox.style.display = "none";
  successBox.style.display = "none";
  const reset = setLoading(document.getElementById("registerBtn"), "جارٍ التسجيل...", "تسجيل");

  const payload = {
    full_name: document.getElementById("regName").value.trim(),
    email: document.getElementById("regEmail").value.trim(),
    phone: document.getElementById("regPhone").value.trim(),
    age: document.getElementById("regAge").value ? parseInt(document.getElementById("regAge").value, 10) : null,
    address: document.getElementById("regAddress").value.trim(),
    password: document.getElementById("regPassword").value,
  };

  try {
    const data = await apiFetch("/auth/register", {
      method: "POST",
      body: JSON.stringify(payload),
    });
    localStorage.setItem("rasokh_token", data.token);
    localStorage.setItem("rasokh_role", "student");
    successBox.textContent = "تم إنشاء الحساب بنجاح، جارٍ تحويلك إلى صفحتك...";
    successBox.style.display = "block";
    setTimeout(() => { window.location.href = "student.html"; }, 900);
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = "block";
    reset();
  }
});

/* ======================= إن كان مسجّلاً دخوله بالفعل، وجّهه مباشرة ======================= */
(function redirectIfLoggedIn() {
  const token = localStorage.getItem("rasokh_token");
  const role = localStorage.getItem("rasokh_role");
  if (token && (role === "student" || role === "admin")) goHome(role);
})();
</script>
</body>
</html>
