<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسوخ | لوحة الطالب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F0E2;
    --bg-raised:#FBF8EE;
    --ink:#1B2C28;
    --ink-soft:#4A5C56;
    --teal-900:#0E332F;
    --teal-700:#1F5951;
    --teal-600:#2C6E64;
    --gold:#B9924F;
    --gold-light:#E4C77E;
    --sage:#7C9683;
    --terracotta:#A8503A;
    --line:#DCD3B8;
    --line-soft:#E9E2CB;
    --shadow: 0 8px 24px rgba(14,51,47,.10);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-weight:400;
    min-height:100vh;
    padding-bottom:80px;
  }
  h1,h2,h3,.brand,.display{font-family:'Amiri', serif;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--gold-light);}
  :focus-visible{outline:2px solid var(--teal-700); outline-offset:2px;}

  /* ===== Topbar ===== */
  .topbar{
    background:var(--teal-900);
    color:var(--bg-raised);
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:30;
    box-shadow:var(--shadow);
  }
  .brand{
    font-size:1.6rem;
    font-weight:700;
    color:var(--gold-light);
    letter-spacing:.5px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand small{
    font-family:'IBM Plex Sans Arabic', sans-serif;
    font-size:.65rem;
    color:#C9BFA0;
    font-weight:400;
  }
  .student-info{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .student-name{font-weight:600; font-size:.95rem;}
  .pill-btn{
    background:transparent;
    border:1px solid #3F615A;
    color:var(--bg-raised);
    padding:8px 14px;
    border-radius:999px;
    font-size:.85rem;
    transition:all .18s ease;
  }
  .pill-btn:hover{background:#173F3A; border-color:var(--gold);}
  .pill-btn.solid{
    background:var(--gold);
    border-color:var(--gold);
    color:#26200F;
    font-weight:600;
  }
  .pill-btn.solid:hover{background:var(--gold-light);}

  /* ===== Sanad chain (stage progression) ===== */
  .sanad-wrap{
    max-width:980px;
    margin:34px auto 10px;
    padding:0 20px;
  }
  .sanad-title{
    font-size:.78rem;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:18px;
    letter-spacing:.5px;
  }
  .sanad-chain{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0;
  }
  .sanad-node{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    cursor:pointer;
    background:none;
    border:none;
    padding:4px 10px;
    position:relative;
    flex:1;
    max-width:180px;
  }
  .bead{
    width:46px; height:46px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Amiri', serif;
    font-weight:700;
    font-size:1.1rem;
    border:2px solid var(--line);
    background:var(--bg-raised);
    color:var(--ink-soft);
    transition:all .2s ease;
  }
  .sanad-node.completed .bead{
    background:var(--teal-700);
    border-color:var(--teal-700);
    color:var(--gold-light);
  }
  .sanad-node.current .bead{
    background:var(--gold);
    border-color:var(--gold);
    color:#25200e;
    box-shadow:0 0 0 5px rgba(185,146,79,.22);
  }
  .sanad-node.locked .bead{color:#B7AD8E; background:var(--line-soft);}
  .sanad-node .label{
    font-size:.72rem;
    text-align:center;
    color:var(--ink-soft);
    line-height:1.3;
  }
  .sanad-node.current .label{color:var(--teal-900); font-weight:600;}
  .thread{
    height:2px;
    flex:1;
    background:var(--line);
    margin-top:-30px;
    max-width:60px;
  }
  .thread.filled{background:var(--teal-700);}

  /* ===== Curriculum ===== */
  .curriculum{
    max-width:980px;
    margin:26px auto;
    padding:0 20px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .subject-card{
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .subject-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    cursor:pointer;
    background:linear-gradient(to left, rgba(185,146,79,.06), transparent);
  }
  .seal{
    --pct:0;
    width:44px;height:44px;border-radius:50%;
    background:conic-gradient(var(--gold) calc(var(--pct)*1%), var(--line-soft) 0);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .seal::after{
    content:attr(data-pct)"%";
    width:34px;height:34px;border-radius:50%;
    background:var(--bg-raised);
    display:flex;align-items:center;justify-content:center;
    font-size:.62rem; font-weight:600; color:var(--teal-900);
  }
  .subject-titles{flex:1;}
  .subject-titles h2{margin:0; font-size:1.15rem; color:var(--teal-900);}
  .subject-titles .sub{font-size:.78rem; color:var(--ink-soft); margin-top:2px;}
  .chevron{
    font-size:.9rem; color:var(--ink-soft);
    transition:transform .2s ease;
  }
  .subject-card.open .chevron{transform:rotate(180deg);}
  .subject-body{
    display:none;
    padding:4px 18px 18px;
    border-top:1px dashed var(--line);
  }
  .subject-card.open .subject-body{display:block;}

  .series-block{margin-top:16px;}
  .series-title{
    font-family:'Amiri', serif;
    font-size:1.02rem;
    color:var(--teal-700);
    display:flex; align-items:center; gap:8px;
    margin-bottom:8px;
  }
  .series-title::before{content:"◆"; color:var(--gold); font-size:.7rem;}

  .item-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 8px;
    border-radius:8px;
    border-bottom:1px solid var(--line-soft);
  }
  .item-row:last-child{border-bottom:none;}
  .item-row:hover{background:rgba(124,150,131,.08);}
  .item-icon{
    width:34px; height:34px; border-radius:8px;
    background:var(--line-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:1rem; flex-shrink:0;
  }
  .item-title{flex:1; font-size:.9rem;}
  .item-title .meta{display:block; font-size:.72rem; color:var(--ink-soft); margin-top:2px;}
  .tiny-btn{
    background:var(--teal-700);
    color:#fff;
    border:none;
    padding:7px 12px;
    border-radius:8px;
    font-size:.75rem;
    font-weight:500;
    white-space:nowrap;
  }
  .tiny-btn:hover{background:var(--teal-900);}
  .tiny-btn.done{background:var(--sage);}
  .tiny-btn.outline{
    background:transparent; border:1px solid var(--teal-700); color:var(--teal-700);
  }
  .page-input{
    width:60px; padding:6px 8px; border:1px solid var(--line); border-radius:6px;
    font-family:inherit; font-size:.8rem; text-align:center;
  }
  .book-progress-bar{
    height:5px; background:var(--line-soft); border-radius:4px; margin-top:4px; overflow:hidden;
  }
  .book-progress-fill{height:100%; background:var(--gold);}

  .test-cta{
    margin-top:12px;
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(14,51,47,.04);
    border:1px dashed var(--teal-700);
    padding:12px 14px; border-radius:10px;
  }
  .test-cta .txt{font-size:.85rem; color:var(--teal-900);}
  .test-cta .txt small{display:block; color:var(--ink-soft); font-size:.72rem; margin-top:2px;}

  /* ===== Floating certificate button ===== */
  .fab-cert{
    position:fixed;
    left:20px; bottom:20px;
    background:var(--gold);
    color:#26200F;
    border:none;
    padding:14px 20px;
    border-radius:999px;
    font-weight:700;
    font-size:.9rem;
    box-shadow:0 10px 26px rgba(185,146,79,.4);
    z-index:20;
  }
  .fab-cert:hover{background:var(--gold-light);}

  /* ===== Modal ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(14,20,18,.55);
    display:none; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--bg-raised);
    border-radius:16px;
    max-width:640px; width:100%;
    padding:26px;
    box-shadow:0 30px 60px rgba(0,0,0,.3);
    position:relative;
    animation:pop .18s ease;
  }
  @keyframes pop{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
  .modal-close{
    position:absolute; top:10px; left:10px; z-index:2;
    width:36px; height:36px; border-radius:50%;
    background:var(--bg-raised); border:none; font-size:1.2rem; color:var(--ink-soft);
  }
  .modal-close:hover{ background:var(--line-soft); }
  .modal h2{color:var(--teal-900); margin-top:0;}

  /* Test modal */
  .q-block{margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--line-soft);}
  .q-title{font-weight:600; margin-bottom:10px;}
  .opt-label{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    margin-bottom:6px; font-size:.88rem; cursor:pointer;
  }
  .opt-label:hover{border-color:var(--teal-700);}
  .opt-label input{accent-color:var(--teal-700);}
  .result-banner{
    text-align:center; padding:16px; border-radius:10px; margin-bottom:16px;
    font-weight:700; font-size:1.1rem;
  }
  .result-banner.pass{background:rgba(124,150,131,.18); color:var(--teal-900);}
  .result-banner.fail{background:rgba(168,80,58,.12); color:var(--terracotta);}

  /* Report modal */
  .report-stats{display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .stat-card{
    flex:1; min-width:110px;
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:14px; text-align:center;
  }
  .stat-card .num{font-family:'Amiri', serif; font-size:1.7rem; color:var(--teal-900); font-weight:700;}
  .stat-card .lbl{font-size:.72rem; color:var(--ink-soft); margin-top:4px;}
  .report-list{list-style:none; padding:0; margin:0;}
  .report-list li{
    display:flex; gap:10px; align-items:flex-start;
    padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:.85rem;
  }
  .report-list li:last-child{border-bottom:none;}

  /* Certificate modal */
  .certificate{
    border:3px double var(--gold);
    padding:36px 26px;
    text-align:center;
    background:
      radial-gradient(circle at top right, rgba(185,146,79,.08), transparent 55%),
      radial-gradient(circle at bottom left, rgba(31,89,81,.08), transparent 55%),
      var(--bg-raised);
    position:relative;
  }
  .certificate .kicker{font-size:.75rem; letter-spacing:2px; color:var(--gold); font-weight:600;}
  .certificate h1{font-size:2rem; color:var(--teal-900); margin:8px 0;}
  .certificate .name{font-family:'Amiri', serif; font-size:1.6rem; color:var(--teal-700); margin:14px 0; border-bottom:1px solid var(--gold-light); display:inline-block; padding-bottom:6px;}
  .certificate .body-txt{font-size:.92rem; color:var(--ink-soft); line-height:1.9; max-width:440px; margin:0 auto;}
  .certificate .stats-row{display:flex; justify-content:center; gap:26px; margin:22px 0;}
  .certificate .stats-row div{text-align:center;}
  .certificate .stats-row .n{font-family:'Amiri', serif; font-size:1.4rem; color:var(--gold); font-weight:700;}
  .certificate .stats-row .l{font-size:.68rem; color:var(--ink-soft);}
  .certificate .seal-stamp{
    width:70px; height:70px; border-radius:50%;
    border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 12px;
    font-family:'Amiri', serif; color:var(--gold); font-weight:700; font-size:.8rem;
    transform:rotate(-8deg);
  }
  .print-btn{margin-top:20px;}


  /* ===== إضافات: روابط، مرحلة معروضة، شريط المرحلة، إشعار ===== */
  a.item-icon.link{ text-decoration:none; background:var(--teal-700); color:#fff; cursor:pointer; }
  a.item-icon.link:hover{ background:var(--teal-900); }
  .sanad-node.viewing .label{ text-decoration:underline; text-underline-offset:4px; text-decoration-color:var(--gold); }
  .stage-banner{
    background:var(--bg-raised); border:1px solid var(--line); border-radius:14px;
    padding:14px 18px; display:flex; flex-direction:column; gap:4px; box-shadow:var(--shadow);
  }
  .stage-banner strong{ font-family:'Amiri', serif; font-size:1.1rem; color:var(--teal-900); }
  .stage-banner span{ font-size:.82rem; color:var(--ink); }
  .stage-banner small{ font-size:.75rem; color:var(--ink-soft); }
  .stage-banner a{ color:var(--teal-700); }
  .certificate .cert-no{ font-size:.72rem; color:var(--ink-soft); letter-spacing:1px; margin:0; }
  .toast{
    position:fixed; bottom:24px; right:50%; transform:translate(50%, 20px);
    background:var(--teal-900); color:var(--bg-raised); padding:12px 20px; border-radius:12px;
    font-size:.88rem; box-shadow:var(--shadow); opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; z-index:80; max-width:calc(100% - 32px); text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(50%, 0); }
  @media (prefers-reduced-motion: reduce){ .toast{ transition:none; } }

  @media print{
    body *{visibility:hidden;}
    #certModal, #certModal *{visibility:visible;}
    #certModal{position:fixed; inset:0; padding:40px;}
    .modal-close, .print-btn{display:none;}
  }

  @media (max-width:640px){
    .sanad-chain{flex-wrap:wrap; gap:10px;}
    .thread{display:none;}
    .subject-titles h2{font-size:1rem;}
    .item-row{flex-wrap:wrap;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">رسوخ <small>أكاديمية العلم الشرعي</small></div>
  <div class="student-info">
    <span class="student-name" id="studentNameLbl"></span>
    <button class="pill-btn solid" id="btnReport">📊 تقريري</button>
    <button class="pill-btn" id="btnLogout">تسجيل خروج</button>
  </div>
</header>

<div class="sanad-wrap">
  <div class="sanad-title">سلسلة المراحل الدراسية — سندك العلمي</div>
  <div class="sanad-chain" id="sanadChain"></div>
</div>

<main class="curriculum" id="curriculumRoot"></main>

<button class="fab-cert" id="btnCertificate">🏆 شهادة المرحلة</button>

<!-- Test Modal -->
<div class="overlay" id="testOverlay">
  <div class="modal" id="testModal">
    <button class="modal-close" data-close="testOverlay">✕</button>
    <div id="testModalBody"></div>
  </div>
</div>

<!-- Report Modal -->
<div class="overlay" id="reportOverlay">
  <div class="modal" id="reportModal">
    <button class="modal-close" data-close="reportOverlay">✕</button>
    <div id="reportModalBody"></div>
  </div>
</div>

<!-- Certificate Modal -->
<div class="overlay" id="certOverlay">
  <div class="modal" id="certModal">
    <button class="modal-close" data-close="certOverlay">✕</button>
    <div id="certModalBody"></div>
  </div>
</div>


<!-- Login Gate (يظهر أولاً حتى يسجل الطالب دخوله عبر الباك إند الحقيقي) -->
<div class="overlay" id="loginOverlay">
  <div class="modal" style="max-width:380px;">
    <h2>تسجيل الدخول</h2>
    <div id="loginError" style="color:var(--terracotta); font-size:.85rem; margin-bottom:10px; display:none;"></div>
    <form id="loginForm">
      <label style="font-size:.8rem; color:var(--ink-soft);">البريد الإلكتروني</label><br>
      <input type="email" id="loginEmail" required
        style="width:100%; padding:10px; margin:6px 0 14px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:.9rem;">
      <label style="font-size:.8rem; color:var(--ink-soft);">كلمة المرور</label><br>
      <input type="password" id="loginPassword" required
        style="width:100%; padding:10px; margin:6px 0 18px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:.9rem;">
      <button type="submit" class="tiny-btn" id="loginSubmitBtn" style="width:100%; padding:12px; font-size:.9rem;">دخول</button>
    </form>
    <p style="font-size:.78rem; color:var(--ink-soft); margin-top:14px;">
      ليس لديك حساب؟ <a href="index.html">سجّل من الصفحة الرئيسية</a>
    </p>
  </div>
</div>

<!-- شاشة تحميل بسيطة أثناء جلب المنهج -->
<div class="overlay" id="loadingOverlay">
  <div class="modal" style="max-width:280px; text-align:center;">
    <p style="margin:0; font-size:.9rem; color:var(--ink-soft);">جارِ تحميل المنهج...</p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   صفحة الطالب — متصلة بالسيرفر عبر /api
   ============================================================ */
const API_BASE = "/api"; // نسبي: يعمل محليًا وبعد النشر بدون تعديل

let authToken = null;
try { authToken = localStorage.getItem("rasokh_token"); } catch (e) {}
let curriculumData = null; // { student_name, stages: [...] }
let viewStageId = null;    // المرحلة المعروضة حاليًا (الحالية افتراضيًا، أو مرحلة مكتملة اختارها الطالب)
const openSubjects = new Set(); // الأقسام المفتوحة، عشان ما تتقفلش لما الصفحة تتحدث

/* ======================= أدوات الأمان ======================= */
// أي نص جاي من السيرفر (أسماء، عناوين، أسئلة...) لازم يعدّي على esc قبل ما يتحط في HTML
function esc(v) {
  return String(v === null || v === undefined ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
// الروابط: http/https بس
function safeHref(url) {
  try {
    const u = new URL(url, window.location.href);
    return (u.protocol === "http:" || u.protocol === "https:") ? u.href : null;
  } catch (e) { return null; }
}

function clearSession() {
  authToken = null;
  try { localStorage.removeItem("rasokh_token"); localStorage.removeItem("rasokh_role"); } catch (e) {}
}

class ApiError extends Error {
  constructor(message, status) { super(message); this.status = status; }
}

async function apiFetch(path, options = {}) {
  let res;
  try {
    res = await fetch(API_BASE + path, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(authToken ? { Authorization: "Bearer " + authToken } : {}),
        ...(options.headers || {}),
      },
    });
  } catch (e) {
    throw new ApiError("تعذّر الاتصال بالخادم، تأكد من اتصالك بالإنترنت.", 0);
  }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new ApiError(data.error || "حدث خطأ غير متوقع.", res.status);
  return data;
}

// لو الجلسة انتهت أو الحساب اتمنع: نرجّع شاشة الدخول
function handleAuthError(err) {
  if (err && (err.status === 401 || err.status === 403) && !(err.message || "").includes("مرحلة")) {
    clearSession();
    showLogin(err.status === 403 ? err.message : "انتهت الجلسة، الرجاء تسجيل الدخول مجددًا.");
    return true;
  }
  return false;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 5000);
}

/* ======================= تسجيل الدخول ======================= */
function showLogin(message) {
  document.getElementById("curriculumRoot").innerHTML = "";
  document.getElementById("sanadChain").innerHTML = "";
  const box = document.getElementById("loginError");
  if (message) { box.textContent = message; box.style.display = "block"; }
  else box.style.display = "none";
  document.getElementById("loginOverlay").classList.add("show");
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errorBox = document.getElementById("loginError");
  const submitBtn = document.getElementById("loginSubmitBtn");
  errorBox.style.display = "none";
  submitBtn.textContent = "جارٍ الدخول...";
  submitBtn.disabled = true;

  try {
    const data = await apiFetch("/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
    authToken = data.token;
    try {
      localStorage.setItem("rasokh_token", data.token);
      localStorage.setItem("rasokh_role", "student");
    } catch (e) {}
    document.getElementById("studentNameLbl").textContent = data.student.full_name;
    document.getElementById("loginOverlay").classList.remove("show");
    viewStageId = null;
    await loadCurriculum();
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = "block";
  } finally {
    submitBtn.textContent = "دخول";
    submitBtn.disabled = false;
  }
});

document.getElementById("btnLogout").addEventListener("click", () => {
  if (!confirm("هل تريد تسجيل الخروج؟")) return;
  clearSession();
  window.location.href = "index.html";
});

/* ======================= جلب المنهج ======================= */
async function loadCurriculum() {
  document.getElementById("loadingOverlay").classList.add("show");
  try {
    curriculumData = await apiFetch("/curriculum");
    document.getElementById("studentNameLbl").textContent = curriculumData.student_name;
    const viewed = curriculumData.stages.find(s => s.id === viewStageId);
    if (!viewed || viewed.status === "locked") viewStageId = null;
    renderSanad();
    renderCurriculum();
  } catch (err) {
    if (!handleAuthError(err)) {
      document.getElementById("curriculumRoot").innerHTML =
        `<p style="color:var(--terracotta); text-align:center;">${esc(err.message)}</p>`;
    }
  } finally {
    document.getElementById("loadingOverlay").classList.remove("show");
  }
}

function currentStage() {
  return curriculumData ? curriculumData.stages.find(s => s.status === "current") : null;
}
function viewedStage() {
  if (!curriculumData) return null;
  return curriculumData.stages.find(s => s.id === viewStageId) || currentStage();
}

// بعد أي تقدم: لو السيرفر قال إن الطالب عدّى لمرحلة جديدة، نفرح معاه ونعيد التحميل
async function afterProgress(result) {
  if (result && result.advanced_to) {
    toast(`🎉 مبارك! أتممت المرحلة وانتقلت إلى مرحلة ${result.advanced_to}`);
    viewStageId = null;
    await loadCurriculum();
    return true;
  }
  return false;
}

/* ======================= أدوات حساب النسب ======================= */
function subjectPercent(subject) {
  let total = 0, done = 0;
  subject.series.forEach(s => {
    s.episodes.forEach(e => { total++; if (e.listened) done++; });
    s.books.forEach(b => { total++; if (b.total_pages === 0 || b.current_page >= b.total_pages) done++; });
    s.tests.forEach(t => { total++; if (t.passed) done++; });
  });
  return total === 0 ? 0 : Math.round((done / total) * 100);
}

/* ======================= سلسلة المراحل (السند) ======================= */
function renderSanad() {
  const el = document.getElementById("sanadChain");
  el.innerHTML = "";
  const viewed = viewedStage();
  curriculumData.stages.forEach((stage, idx) => {
    const node = document.createElement("button");
    node.className = "sanad-node " + stage.status + (viewed && viewed.id === stage.id ? " viewing" : "");
    node.innerHTML = `<div class="bead">${stage.status === "completed" ? "✓" : idx + 1}</div><div class="label">${esc(stage.name)}</div>`;
    node.title = stage.status === "locked" ? "تُفتح بعد إتمام المرحلة التي قبلها" : "عرض محتوى المرحلة";
    node.addEventListener("click", () => {
      if (stage.status === "locked") {
        toast("تُفتح هذه المرحلة تلقائيًا بعد إتمام المرحلة التي قبلها.");
        return;
      }
      viewStageId = stage.status === "current" ? null : stage.id;
      renderSanad();
      renderCurriculum();
      document.getElementById("curriculumRoot").scrollIntoView({ behavior: "smooth" });
    });
    el.appendChild(node);
    if (idx < curriculumData.stages.length - 1) {
      const thread = document.createElement("div");
      thread.className = "thread" + (stage.status === "completed" ? " filled" : "");
      el.appendChild(thread);
    }
  });
}

/* ======================= المنهج (المرحلة المعروضة) ======================= */
function stageBanner(stage) {
  const p = stage.progress || {};
  const parts = [
    `${p.episodes_done || 0} من ${p.episodes_total || 0} حلقة`,
    `${p.books_done || 0} من ${p.books_total || 0} كتاب`,
  ];
  if (p.tests_total) parts.push(`${p.tests_passed} من ${p.tests_total} اختبار`);
  const title = stage.status === "completed"
    ? `مرحلة ${esc(stage.name)} — مكتملة ✓`
    : `مرحلة ${esc(stage.name)} — ${p.percent || 0}%`;
  const hint = stage.status === "current"
    ? `<small>تنتقل للمرحلة التالية تلقائيًا بعد سماع كل الحلقات، وإنهاء كل الكتب، والنجاح في كل الاختبارات.</small>`
    : `<small>أنت تستعرض مرحلة سابقة. <a href="#" id="backToCurrent">ارجع للمرحلة الحالية</a></small>`;
  return `<div class="stage-banner"><strong>${title}</strong><span>${parts.join(" · ")}</span>${hint}</div>`;
}

// لو مفيش ولا قسم مفتوح في المرحلة المعروضة، نفتح أول قسم
function openFirstSubjectIfNone() {
  const stage = viewedStage();
  if (!stage || !stage.subjects.length) return;
  if (![...openSubjects].some(k => k.startsWith(stage.id + ":"))) {
    openSubjects.add(stage.id + ":" + stage.subjects[0].id);
  }
}

function renderCurriculum() {
  openFirstSubjectIfNone();
  const root = document.getElementById("curriculumRoot");
  root.innerHTML = "";
  const stage = viewedStage();
  document.getElementById("btnCertificate").textContent = stage ? `🏆 شهادة مرحلة ${stage.name}` : "🏆 شهادة المرحلة";
  if (!stage) { root.innerHTML = `<p style="text-align:center;">لا توجد مراحل بعد.</p>`; return; }

  root.insertAdjacentHTML("beforeend", stageBanner(stage));
  const back = document.getElementById("backToCurrent");
  if (back) back.addEventListener("click", (e) => {
    e.preventDefault();
    viewStageId = null;
    renderSanad();
    renderCurriculum();
  });

  if (stage.subjects.length === 0) {
    root.insertAdjacentHTML("beforeend",
      `<p style="text-align:center; color:var(--ink-soft);">لم يُضَف محتوى لهذه المرحلة بعد. سيظهر هنا فور إضافته.</p>`);
    return;
  }

  stage.subjects.forEach(subject => {
    const card = document.createElement("div");
    const openKey = stage.id + ":" + subject.id;
    card.className = "subject-card" + (openSubjects.has(openKey) ? " open" : "");
    const pct = subjectPercent(subject);

    const head = document.createElement("div");
    head.className = "subject-head";
    head.innerHTML = `
      <div class="seal" data-pct="${pct}" style="--pct:${pct}"></div>
      <div class="subject-titles">
        <h2>${esc(subject.icon || "")} ${esc(subject.name)}</h2>
        <div class="sub">${subject.series.length} سلسلة</div>
      </div>
      <div class="chevron">▾</div>
    `;
    head.addEventListener("click", () => {
      card.classList.toggle("open");
      if (card.classList.contains("open")) openSubjects.add(openKey); else openSubjects.delete(openKey);
    });

    const body = document.createElement("div");
    body.className = "subject-body";
    if (subject.series.length === 0) {
      body.innerHTML = `<p style="color:var(--ink-soft); font-size:.85rem;">لم يُضَف محتوى لهذا القسم بعد.</p>`;
    }

    subject.series.forEach(series => {
      const block = document.createElement("div");
      block.className = "series-block";
      block.innerHTML = `<div class="series-title">${esc(series.name)}</div>`;

      series.episodes.forEach(ep => {
        const row = document.createElement("div");
        row.className = "item-row";
        const href = ep.url ? safeHref(ep.url) : null;
        row.innerHTML = `
          ${href
            ? `<a class="item-icon link" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="تشغيل الحلقة">▶️</a>`
            : `<div class="item-icon" title="لا يوجد رابط لهذه الحلقة بعد">▶️</div>`}
          <div class="item-title">${esc(ep.title)}<span class="meta">${esc(ep.duration || "")}${href ? "" : (ep.duration ? " · " : "") + "لا يوجد رابط بعد"}</span></div>
          <button class="tiny-btn ${ep.listened ? "done" : ""}">${ep.listened ? "✓ تم السماع" : "تم السماع"}</button>
        `;
        row.querySelector("button").addEventListener("click", () => toggleEpisode(ep));
        block.appendChild(row);
      });

      series.books.forEach(book => {
        const row = document.createElement("div");
        row.className = "item-row";
        const href = book.file_url ? safeHref(book.file_url) : null;
        const bookPct = book.total_pages > 0 ? Math.min(100, Math.round((book.current_page / book.total_pages) * 100)) : 0;
        row.innerHTML = `
          ${href
            ? `<a class="item-icon link" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="فتح الكتاب">📖</a>`
            : `<div class="item-icon" title="لا يوجد رابط لهذا الكتاب بعد">📖</div>`}
          <div class="item-title">${esc(book.title)}
            <span class="meta">صفحة ${book.current_page} من ${book.total_pages}</span>
            <div class="book-progress-bar"><div class="book-progress-fill" style="width:${bookPct}%"></div></div>
          </div>
          <input type="number" class="page-input" min="0" max="${book.total_pages}" value="${book.current_page}" aria-label="رقم الصفحة الحالية">
          <button class="tiny-btn outline">تحديث</button>
        `;
        row.querySelector("button").addEventListener("click", () => {
          updateBookPage(book, row.querySelector("input").value);
        });
        block.appendChild(row);
      });

      series.tests.forEach(test => {
        const tried = test.last_score !== null && test.last_score !== undefined;
        const cta = document.createElement("div");
        cta.className = "test-cta";
        const status = test.passed
          ? `✓ ناجح — آخر نتيجة: ${test.last_score}%`
          : tried ? `آخر نتيجة: ${test.last_score}% — النجاح من ${test.pass_percent}%` : `لم يُؤدَّ بعد — النجاح من ${test.pass_percent}%`;
        cta.innerHTML = `
          <div class="txt">${esc(test.title)}<small>${status}</small></div>
          <button class="tiny-btn">${tried ? "إعادة الاختبار" : "بدء الاختبار"}</button>
        `;
        cta.querySelector("button").addEventListener("click", () => openTest(test.id));
        block.appendChild(cta);
      });

      body.appendChild(block);
    });

    card.appendChild(head);
    card.appendChild(body);
    root.appendChild(card);
  });
}

/* ======================= تحديث الحلقة ======================= */
async function toggleEpisode(ep) {
  const newState = !ep.listened;
  ep.listened = newState;
  renderCurriculum();
  try {
    const result = await apiFetch("/progress/episode", {
      method: "POST",
      body: JSON.stringify({ episode_id: ep.id, listened: newState }),
    });
    if (!(await afterProgress(result))) await refreshProgressQuietly();
  } catch (err) {
    ep.listened = !newState;
    renderCurriculum();
    if (!handleAuthError(err)) toast(err.message);
  }
}

/* ======================= تحديث صفحة الكتاب ======================= */
async function updateBookPage(book, rawValue) {
  const previous = book.current_page;
  let val = parseInt(rawValue, 10);
  if (isNaN(val) || val < 0) val = 0;
  if (val > book.total_pages) val = book.total_pages;
  book.current_page = val;
  renderCurriculum();
  try {
    const result = await apiFetch("/progress/book", {
      method: "POST",
      body: JSON.stringify({ book_id: book.id, current_page: val }),
    });
    book.current_page = result.current_page;
    if (!(await afterProgress(result))) await refreshProgressQuietly();
  } catch (err) {
    book.current_page = previous;
    renderCurriculum();
    if (!handleAuthError(err)) toast(err.message);
  }
}

// يحدّث نسب التقدم من غير شاشة تحميل ومن غير ما يقفل الأقسام المفتوحة
async function refreshProgressQuietly() {
  try {
    curriculumData = await apiFetch("/curriculum");
    renderSanad();
    renderCurriculum();
  } catch (err) { handleAuthError(err); }
}

/* ======================= الاختبار ======================= */
async function openTest(testId) {
  const overlay = document.getElementById("testOverlay");
  const body = document.getElementById("testModalBody");
  body.innerHTML = `<p style="text-align:center; color:var(--ink-soft);">جارٍ تحميل الاختبار...</p>`;
  overlay.classList.add("show");

  let test;
  try {
    test = await apiFetch(`/tests/${testId}`);
  } catch (err) {
    if (handleAuthError(err)) { overlay.classList.remove("show"); return; }
    body.innerHTML = `<p style="color:var(--terracotta); text-align:center;">${esc(err.message)}</p>`;
    return;
  }

  body.innerHTML = `<h2>${esc(test.title)}</h2><p style="font-size:.8rem; color:var(--ink-soft);">النجاح من ${test.pass_percent}%</p><form id="testForm"></form>`;
  const form = body.querySelector("#testForm");

  test.questions.forEach((q, qi) => {
    const block = document.createElement("div");
    block.className = "q-block";
    const optsHtml = q.options.map(opt => `
      <label class="opt-label">
        <input type="radio" name="q${q.id}" value="${opt.id}" required>
        ${esc(opt.text)}
      </label>
    `).join("");
    block.innerHTML = `<div class="q-title">${qi + 1}. ${esc(q.text)}</div>${optsHtml}`;
    form.appendChild(block);
  });

  const submitBtn = document.createElement("button");
  submitBtn.type = "submit";
  submitBtn.className = "tiny-btn";
  submitBtn.style.padding = "10px 22px";
  submitBtn.textContent = "تسليم الإجابات";
  form.appendChild(submitBtn);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const answers = test.questions.map(q => {
      const chosen = form.querySelector(`input[name="q${q.id}"]:checked`);
      return { question_id: q.id, option_id: chosen ? parseInt(chosen.value, 10) : null };
    });
    submitBtn.disabled = true;
    submitBtn.textContent = "جارٍ التصحيح...";
    try {
      const result = await apiFetch(`/tests/${testId}/attempt`, { method: "POST", body: JSON.stringify({ answers }) });
      showTestResult(test, result);
    } catch (err) {
      if (handleAuthError(err)) { overlay.classList.remove("show"); return; }
      toast(err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = "تسليم الإجابات";
    }
  });
}

async function showTestResult(test, result) {
  const body = document.getElementById("testModalBody");
  body.innerHTML = `
    <h2>${esc(test.title)}</h2>
    <div class="result-banner ${result.passed ? "pass" : "fail"}">
      ${result.passed ? "أحسنت! لقد اجتزت الاختبار 🎉" : "لم تحقق النسبة المطلوبة، راجع الدروس وحاول مرة أخرى"}
    </div>
    <p style="text-align:center; font-size:.95rem;">
      عدد الإجابات الصحيحة: <strong>${result.correct_count}</strong> من ${result.total_questions}<br>
      النسبة: <strong>${result.score}%</strong>
    </p>
    <div style="text-align:center; margin-top:16px;">
      <button class="tiny-btn" id="closeTestBtn">إغلاق</button>
    </div>
  `;
  body.querySelector("#closeTestBtn").addEventListener("click", () => closeOverlay("testOverlay"));
  if (!(await afterProgress(result))) await refreshProgressQuietly();
}

/* ======================= تقرير الطالب ======================= */
async function openReport() {
  const overlay = document.getElementById("reportOverlay");
  const body = document.getElementById("reportModalBody");
  body.innerHTML = `<p style="text-align:center; color:var(--ink-soft);">جارٍ تحميل التقرير...</p>`;
  overlay.classList.add("show");

  let report;
  try {
    report = await apiFetch("/progress/me/report");
  } catch (err) {
    if (handleAuthError(err)) { overlay.classList.remove("show"); return; }
    body.innerHTML = `<p style="color:var(--terracotta); text-align:center;">${esc(err.message)}</p>`;
    return;
  }

  const li = i => `<li>${i.type === "episode" ? "▶️" : "📖"} ${esc(i.title)} <span style="color:var(--ink-soft)">— ${esc(i.context)}</span></li>`;
  body.innerHTML = `
    <h2>📊 تقريري — مرحلة ${esc(report.stage_name || "")}</h2>
    <div class="report-stats">
      <div class="stat-card"><div class="num">${report.completed.length}</div><div class="lbl">عنصر مكتمل</div></div>
      <div class="stat-card"><div class="num">${report.in_progress.length}</div><div class="lbl">عنصر قيد الدراسة</div></div>
    </div>
    <h3 style="font-size:1rem; color:var(--teal-700);">✅ تم الانتهاء منه</h3>
    <ul class="report-list">${report.completed.map(li).join("") || "<li>لا يوجد بعد</li>"}</ul>
    <h3 style="font-size:1rem; color:var(--terracotta); margin-top:16px;">⏳ قيد الدراسة</h3>
    <ul class="report-list">${report.in_progress.map(li).join("") || "<li>لا يوجد</li>"}</ul>
  `;
}

/* ======================= شهادة المرحلة المعروضة ======================= */
async function openCertificate() {
  const overlay = document.getElementById("certOverlay");
  const body = document.getElementById("certModalBody");
  const stage = viewedStage();
  if (!stage) return;

  body.innerHTML = `<p style="text-align:center; color:var(--ink-soft);">جارٍ التحقق من الإنجاز...</p>`;
  overlay.classList.add("show");

  let cert;
  try {
    cert = await apiFetch(`/progress/certificate/${stage.id}`);
  } catch (err) {
    if (handleAuthError(err)) { overlay.classList.remove("show"); return; }
    body.innerHTML = `<p style="color:var(--terracotta); text-align:center;">${esc(err.message)}</p>`;
    return;
  }

  if (!cert.eligible) {
    body.innerHTML = `
      <h2>🏆 شهادة مرحلة ${esc(cert.stage_name)}</h2>
      <p style="font-size:.9rem; color:var(--ink-soft); line-height:1.9;">
        لم تكتمل متطلبات المرحلة بعد. نسبة إنجازك الحالية <strong>${cert.percent}%</strong>.<br>
        تُصدر الشهادة بعد سماع كل الحلقات، وإنهاء كل الكتب${cert.total_tests ? `، والنجاح في كل الاختبارات (${cert.tests_passed} من ${cert.total_tests})` : ""}.
      </p>
    `;
    return;
  }

  const date = cert.completed_at
    ? new Date(cert.completed_at.replace(" ", "T") + "Z").toLocaleDateString("ar-EG", { year: "numeric", month: "long", day: "numeric" })
    : "";
  body.innerHTML = `
    <div class="certificate" id="certPrintArea">
      <div class="seal-stamp">رسوخ</div>
      <div class="kicker">شهادة إتمام</div>
      <h1>مرحلة ${esc(cert.stage_name)}</h1>
      <p class="body-txt">تشهد أكاديمية <strong>رسوخ</strong> للعلم الشرعي بأن الطالب</p>
      <div class="name">${esc(cert.student_name)}</div>
      <p class="body-txt">قد أتمّ بحمد الله جميع متطلبات هذه المرحلة من حلقات وكتب واختبارات بتاريخ ${esc(date)}.</p>
      <div class="stats-row">
        <div><div class="n">${cert.total_episodes}</div><div class="l">حلقة</div></div>
        <div><div class="n">${cert.total_books}</div><div class="l">كتاب</div></div>
        <div><div class="n">${cert.total_tests}</div><div class="l">اختبار</div></div>
      </div>
      <p class="cert-no">رقم الشهادة: ${esc(cert.certificate_no)}</p>
      <button class="tiny-btn print-btn" id="printCertBtn">🖨️ طباعة الشهادة</button>
    </div>
  `;
  body.querySelector("#printCertBtn").addEventListener("click", () => window.print());
}

/* ======================= أدوات عامة ======================= */
function closeOverlay(id) { document.getElementById(id).classList.remove("show"); }

document.querySelectorAll("[data-close]").forEach(btn => {
  btn.addEventListener("click", () => closeOverlay(btn.dataset.close));
});
document.querySelectorAll(".overlay").forEach(ov => {
  ov.addEventListener("click", (e) => {
    if (e.target === ov && ov.id !== "loginOverlay" && ov.id !== "loadingOverlay") ov.classList.remove("show");
  });
});

document.getElementById("btnReport").addEventListener("click", openReport);
document.getElementById("btnCertificate").addEventListener("click", openCertificate);

/* ======================= بداية الصفحة ======================= */
if (authToken) {
  document.getElementById("loginOverlay").classList.remove("show");
  loadCurriculum();
} else {
  showLogin();
}
</script>
